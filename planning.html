<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plannings bénévoles – Saint-Galmier Judo Club</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#269060;--navy:#145c3f;--accent:#43b77d;--cream:#f4f1e8;--red:#9c4128;--txt:#16281f;--mut:#4d6156;--line:#d9d4c3}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 Nunito,system-ui,sans-serif;background:var(--dark);color:var(--cream);min-height:100vh}
header{background:var(--navy);padding:18px 16px;border-bottom:4px solid var(--accent)}
.wrap{max-width:760px;margin:0 auto}
.hd{display:flex;align-items:center;gap:14px}
.hd img{width:64px;height:64px;border-radius:50%;background:#fff;flex:none}
h1{font:400 clamp(1.8rem,7vw,2.6rem)/1 'Bebas Neue',sans-serif;letter-spacing:1.5px;margin:0}
.hd p{margin:4px 0 0;opacity:.85;font-size:.95rem}
main{padding:6px 14px 50px}
h2{font:400 1.6rem 'Bebas Neue',sans-serif;letter-spacing:2px;margin:26px 0 8px}
.card{background:var(--cream);color:var(--txt);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 20px #0002}
.slot{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.time{font:400 1.5rem 'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--navy)}
.dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--dark)}.dot.on{background:var(--dark)}
.cnt{font-size:.85rem;color:var(--mut);margin-left:6px;font-weight:700}
.names{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#dfe9e1;border-radius:99px;padding:2px 11px;font-size:.9rem;font-weight:600}
.chip button{border:0;background:none;color:var(--red);cursor:pointer;font-size:1rem;padding:0 0 0 5px}
.go{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:800 .95rem Nunito,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.go:disabled{background:#9aa79f;cursor:default}
.alt{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font:700 .95rem Nunito}
.pl{display:block;text-decoration:none;color:var(--txt)}
.pl .time{font-size:1.7rem}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
dialog{border:0;border-radius:14px;padding:20px;width:min(92vw,420px);background:var(--cream);color:var(--txt)}
dialog::backdrop{background:#000a}
label{display:block;font-weight:800;margin:12px 0 4px;font-size:.9rem}
input,textarea{width:100%;padding:10px;border:1px solid #b9c4bc;border-radius:8px;font:1rem Nunito,sans-serif;background:#fff}
textarea{min-height:170px;font-size:.88rem}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.err{color:var(--red);min-height:1.3em;margin:8px 0 0;font-size:.92rem;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
.admin{background:#0003;border:2px dashed var(--cream);border-radius:12px;padding:12px 14px;margin:16px 0;display:none}
.admin .go,.admin .alt{margin:4px 6px 0 0;color:#fff;border-color:#fff8}
.back{color:var(--cream);font-weight:700;display:inline-block;margin-top:14px}
.empty{opacity:.9;padding:20px 0}
footer{text-align:center;font-size:.85rem;padding:0 0 30px;opacity:.8}
footer a{cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header><div class="wrap hd">
 <img src="logo.png" alt="Logo Saint-Galmier Judo Club">
 <div><h1 id="h1">Plannings bénévoles</h1><p id="sub">Saint-Galmier Judo Club</p></div>
</div></header>
<main><div class="wrap">
  <div id="view"><p class="empty">Chargement…</p></div>
</div></main>

<dialog id="dInsc"><form method="dialog" id="fInsc">
 <b id="dTitre"></b>
 <label for="prenom">Prénom</label><input id="prenom" required maxlength="25" autocomplete="given-name">
 <label for="nom">Nom</label><input id="nom" required maxlength="30" autocomplete="family-name">
 <div id="codeBox"><label for="code">Code du club</label><input id="code" type="password" autocomplete="off"></div>
 <p class="err" id="eInsc"></p>
 <div class="row"><button type="button" class="alt" data-close>Annuler</button><button class="go">Je m’inscris</button></div>
</form></dialog>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== À REMPLIR : configuration du projet Firebase « plannings » ====== */
const firebaseConfig = { apiKey:"AIzaSyCg_dzMv1enOPDios7MRLM8qdETaTpb-cQ", authDomain:"sgjc-plannings.firebaseapp.com", projectId:"sgjc-plannings", appId:"1:17408106827:web:309c4a3061d1e2ad9e48ce" };
const VOL_EMAIL = "benevoles@sgjc.local"; // compte partagé : son mot de passe = code du club
/* ======================================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const Q = new URLSearchParams(location.search), P = Q.get("p"); let K = Q.get("k");
const kq = k => K ? (k?"&":"?")+"k="+encodeURIComponent(K) : "";
let db, auth, plans=[], slots=[], current=null;

if(!firebaseConfig.projectId){ $("view").innerHTML='<div class="card">Configuration Firebase manquante (voir <b>firebaseConfig</b> dans le script).</div>'; }
else{
 firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth();
 const fail=e=>$("view").innerHTML='<div class="card err">Chargement impossible : '+esc(e.message)+'</div>';
 db.collection("plannings").onSnapshot(s=>{plans=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
 db.collection("creneaux").onSnapshot(s=>{slots=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
const left=s=>s.max>0?s.max-(s.inscrits||[]).length:null;

function render(){
 if(!db) return;
 const plan=plans.find(p=>p.id===P);
 if(!P){
  $("h1").textContent="Plannings bénévoles"; $("sub").textContent="Saint-Galmier Judo Club · Choisis l’événement";
  const l=[...plans].sort((a,b)=>(b.ordre||0)-(a.ordre||0));
  $("view").innerHTML=l.length?l.map(p=>{
   const ss=slots.filter(s=>s.event===p.id&&s.max>0), free=ss.reduce((n,s)=>n+left(s),0);
   return `<a class="card pl" href="?p=${encodeURIComponent(p.id)}${kq(1)}"><div class="time">${esc(p.titre)}</div><div>${esc(p.date||"")}</div><div class="cnt" style="margin:4px 0 0">${ss.length?`${free} place${free>1?"s":""} à pourvoir`:"Inscriptions ouvertes"}</div></a>`}).join("")
   :'<p class="empty">Aucun planning ouvert pour le moment.</p>'; return;
 }
 if(!plan){ $("view").innerHTML='<p class="empty">Planning introuvable.</p><a class="back" href="./planning.html${kq(0)}">← Tous les plannings</a>'; return; }
 $("h1").textContent=plan.titre; $("sub").textContent=(plan.date||"")+" · Saint-Galmier Judo Club";
 document.title=plan.titre+" – Planning bénévoles";
 const list=slots.filter(s=>s.event===P).sort((a,b)=>a.ordre-b.ordre);
 let html="",sect="";
 for(const s of list){
  const ins=s.inscrits||[], r=left(s), full=r!==null&&r<=0;
  if(s.section!==sect){sect=s.section;html+=`<h2>${esc(sect)}</h2>`}
  let dots=""; if(s.max>0) for(let i=0;i<s.max;i++) dots+=`<span class="dot ${i<ins.length?"on":""}"></span>`;
  const cnt=s.max>0?(full?"Complet":`${r} place${r>1?"s":""} restante${r>1?"s":""}`):"";
  html+=`<div class="card slot"><div><div class="time">${esc(s.horaire)}</div><div class="dots">${dots}<span class="cnt">${cnt}</span></div></div>
  <button class="go" data-id="${s.id}" ${full?"disabled":""}>${full?"Complet":"Je m’inscris"}</button>
  <div class="names">${ins.map((n,i)=>`<span class="chip">${esc(n)}</span>`).join("")}</div></div>`;
 }
 $("view").innerHTML=(html||'<p class="empty">Aucun créneau.</p>')+'<a class="back" href="./planning.html${kq(0)}">← Tous les plannings</a>';
}

document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b) return;
 if(b.dataset.close!==undefined) b.closest("dialog").close();
 if(b.dataset.id){ current=slots.find(s=>s.id===b.dataset.id); $("dTitre").textContent=current.section+" · "+current.horaire; $("eInsc").textContent=""; const need=!auth.currentUser&&!K; $("code").required=need; $("codeBox").style.display=need?"block":"none"; $("dInsc").showModal(); }
});

$("fInsc").addEventListener("submit",async e=>{
 e.preventDefault(); $("eInsc").textContent="";
 const p=$("prenom").value.trim(), n=$("nom").value.trim();
 const name=p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()+" "+n.charAt(0).toUpperCase()+".";
 try{
  if(!auth.currentUser) await auth.signInWithEmailAndPassword(VOL_EMAIL,K||$("code").value);
  const ref=db.collection("creneaux").doc(current.id);
  await db.runTransaction(async tx=>{
   const s=(await tx.get(ref)).data(), ins=s.inscrits||[];
   if(s.max>0&&ins.length>=s.max) throw new Error("full");
   if(ins.includes(name)) throw new Error("dup");
   tx.update(ref,{inscrits:[...ins,name]});
  });
  $("dInsc").close(); $("fInsc").reset(); toast("C’est noté, merci "+p+" !");
 }catch(err){
  const m=err.code||err.message;
  $("eInsc").textContent=m==="full"?"Ce créneau vient d’être complété, choisis-en un autre."
   :m==="dup"?"Tu es déjà inscrit(e) sur ce créneau."
   :/invalid|wrong|credential/.test(m)?(K?(K=null,$("code").required=true,$("codeBox").style.display="block","Le code du lien n’est pas valide : saisis le code du club."):"Code du club incorrect.")
   :"Inscription impossible ("+m+").";
 }
});

</script>
</body>
</html>
